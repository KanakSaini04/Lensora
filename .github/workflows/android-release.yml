name: Lensora Android Release & CI/CD Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Lensora APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          name: Lensora DSLR Camera Release ${{ github.ref_name }}
          body: |
            ## Lensora DSLR Computational Camera App - ${{ github.ref_name }}
            - Optimized for Redmi Note 13 Pro 5G (200MP ISOCELL HP3)
            - 4-Tab Sci-Fi Flight-Deck Interface
            - AGSL GPU Shaders (Focus Peaking, Zebra Stripes, False Color Map, Anamorphic Flares)
            - Zero-Shutter-Lag (ZSL) 0.5s Pre-Capture Ring Buffer
            - VN-Style Color Grading & 1-Tap JSON Template Engine
            - Fully Unit-Tested with 0% Failure Rate
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
